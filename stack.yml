version: "3.9"

services:

  charge-manager:
    image: charges/manager:1.0
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/charges
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  charge-proxy:
    image: charges/proxy:1.0
    ports:
      - "9090:9090"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: charges
    volumes:
      - dbdata:/var/lib/postgresql/data
    deploy:
      replicas: 1

volumes:
  dbdata:
