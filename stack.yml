version: "3.9"

services:

  charge-manager:
    image: charges/manager:1.0
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/charges
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    depends_on:
      - db
    networks: 
      - app-network 

  charge-proxy:
    image: charges/proxy:1.0
    ports:
      - "9000:9000"
    environment:
      CHARGE_MANAGER_URL: http://charge-manager:8080
      API_KEY: ${API_KEY}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN}
    depends_on:
      - charge-manager
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    networks: 
      - app-network 


  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: charges
    volumes:
      - dbdata:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks: 
      - app-network 

volumes:
  dbdata:

networks:
  app-network:
    driver: overlay
