server.port=8081
spring.application.name=payments-proxy

# Where to notify the Manager (inside Docker network)
manager.url=${MANAGER_URL:http://payments-manager:8080}

# ASAAS base URL (sandbox by default)
asaas.base.url=${ASAAS_BASE_URL:https://api-sandbox.asaas.com/v3}

# ASAAS API key (use "MOCK" to run without external calls)
asaas.api.key=${ASAAS_API_KEY:MOCK}

# Webhook security token (ASAAS sends it in header 'asaas-access-token')
asaas.webhook.token=${ASAAS_WEBHOOK_TOKEN:webhook-secret}
