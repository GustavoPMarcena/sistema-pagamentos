server.port=8080
spring.application.name=payments-manager

# Database (can be overridden by environment variables in Docker)
spring.datasource.url=jdbc:postgresql://postgres:5432/payments_db
spring.datasource.username=payments
spring.datasource.password=payments


spring.flyway.enabled=true

# Proxy (service name inside Docker network)
proxy.url=${PROXY_URL:http://payments-proxy:8081}

# Webhook security (used when proxy notifies the manager)
webhook.token=${WEBHOOK_TOKEN:webhook-secret}

# Mail (optional; for local tests you can leave it blank and we'll log to console)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}

# Optional SOAP/RPC integration with Charge Proxy (Professor diagram)
proxy.soap.enabled=${PROXY_SOAP_ENABLED:false}
proxy.soap.base-url=${PROXY_SOAP_BASE_URL:}
